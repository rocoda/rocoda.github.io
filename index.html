<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RoCoDA: Counterfactual Data Augmentation for Data-Efficient Robot Learning from Demonstrations">
    <title>RoCoDA: Counterfactual Data Augmentation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333;
        }

        header {
            max-width: 800px;
            margin: 20px auto;
            text-align: center;
        }

        section {
            max-width: 800px;
            font-size: 1.1em;
            margin: 20px auto;
            padding: 20px;
            background-color: white;
        }

        h1 {
            font-size: 3em;
        } 

        h2 {
            color: #007acc;
        }

        .arxiv-link {
            display: inline-block;          /* Make it a block-level element to apply padding */
            padding: 10px 20px;             /* Add space inside the button */
            background-color: #007acc;      /* Button background color */
            color: white;                   /* Button text color */
            text-decoration: none;          /* Remove underline */
            border-radius: 20px;            /* Create the pill shape */
            font-size: 14px;                /* Adjust font size */
            font-weight: bold;              /* Make the text bold */
            text-align: center;             /* Center-align text */
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1); /* Add a subtle shadow for depth */
            transition: background-color 0.3s ease, box-shadow 0.3s ease; /* Smooth hover effect */
        }

        .arxiv-link:hover {
            background-color: #005f99;      /* Darker blue on hover */
            box-shadow: 0px 6px 8px rgba(0, 0, 0, 0.2); /* Increase shadow on hover */
        }

        .author-block {
            font-size: 1.2em;
            margin-top: 0;
            margin-bottom: 15px;
        }


        .video-container {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        .arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2rem;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            cursor: pointer;
            padding: 10px;
        }

        .arrow.left {
            left: 0;
        }

        .arrow.right {
            right: 0;
        }

        .tab-container {
            text-align: center;
            margin-top: 20px;
        }

        .circle {
            display: inline-block;
            width: 20px;
            height: 20px;
            background-color: #ccc;
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
        }
        
        .circle-container {
            display: flex;               /* Use flexbox */
            justify-content: center;      /* Center the circles horizontally */
            align-items: center;          /* Align items vertically in the middle */
            margin-top: 20px;
        }

        .circle.active {
            background-color: #007bff;
        }

        video {
            display: block;
            width: 100%;
            max-width: 800px;
            height: auto;
        }

    </style>
</head>
<body>
    <header id="header"></header>
    
    <section>     
        <div id="abstract_video"></div>
    </section>

    <section>

    </section>

    <section>

    <div class="video-container">

        <button class="arrow left" onclick="changeVideo(-1)">&#10094;</button>
        <button class="arrow right" onclick="changeVideo(1)">&#10095;</button>
    </div>
    
    <div class="circle-container" id="circle-container">

        <div class="circle" onclick="selectVideo(1)"></div>
        <div class="circle" onclick="selectVideo(2)"></div>
        <div class="circle" onclick="selectVideo(3)"></div>

        <div class="circle" onclick="selectVideo(5)"></div>

        <div class="circle" onclick="selectVideo(7)"></div>
        <div class="circle" onclick="selectVideo(8)"></div>
        <div class="circle" onclick="selectVideo(9)"></div>
    </div>
    
    <!-- Buttons to load different video sets -->
    <div class="set-buttons" style="text-align: center; margin-top: 20px;">
        <button onclick="initVideoSet('set1')">Three Block Stack</button>
        <button onclick="initVideoSet('set2')">Coffee</button>
        <button onclick="initVideoSet('set3')">Three Piece Assembly</button>

    </div>
    </section>

    <section>
        <div class="video-container">
            <video id="video-frame-2" controls>
                <source id="video-source-2" src="">
            </video>
        
            <button class="arrow left" onclick="changeVideo2(-1)">&#10094;</button>

        </div>
        
        <div class="circle-container" id="circle-container-2">

            <div class="circle" onclick="selectVideo2(5)"></div>
            <div class="circle" onclick="selectVideo2(6)"></div>
            <div class="circle" onclick="selectVideo2(7)"></div>
            <div class="circle" onclick="selectVideo2(8)"></div>
            <div class="circle" onclick="selectVideo2(9)"></div>
        </div>
        
        <!-- Buttons to load different video sets -->
        <div class="set-buttons" style="text-align: center; margin-top: 20px;">
            <button onclick="initVideoSet2('set4')">Transport (Causal Augment)</button>

    
        </div>

    <section>
        <h2>Emergent Behaviors and Broader Implications</h2>
        <div id="emergent_behaviors"></div>
    </section>


    <script src="video.js"></script>
    <script src="video2.js"></script>

    <script>
        // Function to load content from external files into the main HTML file
        function loadHTML(file, elementId, callback) {
            var xhttp = new XMLHttpRequest();
            xhttp.onreadystatechange = function() {
                if (this.readyState == 4 && this.status == 200) {
                    document.getElementById(elementId).innerHTML = this.responseText;
                    if (callback) {
                        callback();
                    }
                }
            };
            xhttp.open("GET", file, true);
            xhttp.send();
        }

        // Load each section and attach the scrolling functionality for "results_threestack"
        loadHTML("header.html", "header");
        loadHTML("abstract_video.html", "abstract_video");
        loadHTML("abstract.html", "abstract");
        loadHTML("method.html", "method");
        loadHTML("emergent_behavior.html", "emergent_behaviors");
        // loadHTML("results_threestack1.html", "results_threestack");

        // loadHTML("results_coffee.html", "results_coffee");

    </script>

</body>
</html>
